[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-docs"
version = "0.0.0"
description = "Documentation build dependencies for the Vehicle project."
requires-python = ">=3.10"
dependencies = [
  "alabaster>=0.7,<1",
  "babel>=2.12,<3",
  "docutils>=0.18,<0.22",
  "imagesize>=1.4,<2",
  "jinja2>=3.1,<4",
  "markupsafe>=2.1,<4",
  "myst-parser>=1,<5",
  "packaging>=23,<25",
  "pygments>=2.14,<3",
  "requests>=2.31,<3",
  "roman-numerals>=3,<4",
  "snowballstemmer>=2.0,<3",
  "sphinx>=6.1.3,<10",
  "sphinx-rtd-theme>=1,<4",
  "typing-extensions>=4.6,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
