[build-system]
requires = [
  "find_libpython>=0.3; sys_platform=='win32'",
  "packaging>=23",
  "setuptools>=45",
  "swig>=4",
]
build-backend = "setuptools.build_meta"

[project]
name = 'vehicle_lang'
authors = [{ name = 'Wen Kokke', email = 'wenkokke@users.noreply.github.com' }]
description = 'A high-level functional language for writing mathematically-precise specifications for neural networks.'
readme = 'README.md'
license = 'MIT'
license-files = [ "LICENSE" ]
dynamic = ["version"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "typing-extensions>=4.6,<5",
    "jaxtyping>=0.2, <0.4",
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.1,<10",
  "packaging>=23",
  "pygments>=2.14,<3",
  "numpy>=1.21,<3",
]
mypy = [
  "types-setuptools>=45",
  "types-pygments>=2.14,<3",
]
pygments = ["pygments>=2.14,<3"]
numpy = ["numpy>=1.21,<3"]
jax = ["jax>=0.4.26"]
dev = ["pre-commit>=4.3.0"]
wheel = [
  "build",
  "auditwheel; sys_platform == 'linux'",
  "delocate; sys_platform == 'darwin'",
]
tensorflow = [
  "tensorflow>=2,<3; (python_version >= '3.10' and python_version < '3.13') and ((sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
]
pytorch = [
  "torch>=2,<3; python_version >= '3.10' and python_version < '3.13'",
]

[project.scripts]
vehicle = "vehicle_lang.__main__:main"

[project.entry-points.'pygments.lexers']
vehicle = "vehicle_lang.pygments:VehicleLexer"

[tool.cibuildwheel]
# 18-04-2023:
# Cross-compilation does not work with GHC and Cabal.
archs = ["native"]
build-frontend = "build"
build = [
  # Using a GitHub runner
  "*-macosx_x86_64",
  "*-macosx_arm64",
  # Using a GitHub runner
  "*-win_amd64",
  # Using wenkokke/manylinux2014_ghc965_x86_64
  "*-manylinux_x86_64",
  # Using wenkokke/manylinux2014_ghc965_i686
  "*-manylinux_i686",
  # Using wenkokke/manylinux_2_28_ghc965_aarch64
  "*-manylinux_aarch64",
  # Using wenkokke/musllinux_1_1_ghc965_x86_64
  "*-musllinux_x86_64",
]
skip = [
  # 18-04-2023:
  # PyPy builds do not work.
  "pp*",
]
#test-command = "pytest {package}/tests"
#test-extras = "test"
# 19-06-2023:
# Use custom manylinux and musllinux images with GHC 9.6.5 preinstalled.
manylinux-aarch64-image = "wenkokke/manylinux_2_28_ghc965_aarch64"
manylinux-i686-image = "wenkokke/manylinux2014_ghc965_i686"
manylinux-x86_64-image = "wenkokke/manylinux_2_28_ghc965_x86_64"
musllinux-x86_64-image = "wenkokke/musllinux_1_1_ghc965_x86_64"

[tool.mypy]
mypy_path = "src"
python_version = "3.10"
strict = true
implicit_reexport = false
ignore_missing_imports = true
exclude = ['^src/vehicle_lang/binding\.py$']

[[tool.mypy.overrides]]
module = "vehicle_lang.pygments"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "vehicle_lang.pygments._external"
disallow_subclassing_any = false
disallow_untyped_defs = false
disable_error_code = ['name-defined']

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "vehicle_lang._version.VERSION" }

[tool.setuptools_scm.tag]
strict = true
