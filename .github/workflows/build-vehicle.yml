name: Build vehicle

on:
  workflow_call:

defaults:
  run:
    shell: sh

jobs:
  build-vehicle:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: "Linux"
            type: ubuntu-latest
          - name: "macOS"
            # macos-15 rather than macos-latest until actions/runner-images#14940 is fixed; see https://github.com/haskell/cabal/pull/12468.
            type: macos-15
          - name: "Windows"
            type: "windows-latest"
        haskell:
          - ghc:
              version: "9.6.5"
            cabal:
              version: "3.14.2.0"
              project-file: "cabal.project"
              extra-args: ""
              extra-args-test-golden: ""
        include:
          # GHC 9.14 (newest)
          - os:
              name: Linux
              type: ubuntu-latest
            haskell:
              ghc:
                version: "9.14.1"
              cabal:
                version: "3.16.1.0"
                project-file: "cabal.project"
                extra-args: ""
                extra-args-test-golden: "--test-option='--allowlist-externals=TestVerifier'"
          # GHC 9.12
          - os:
              name: Linux
              type: ubuntu-latest
            haskell:
              ghc:
                version: "9.12.2"
              cabal:
                version: "3.14.2.0"
                project-file: "cabal.project"
                extra-args: ""
                extra-args-test-golden: "--test-option='--allowlist-externals=TestVerifier'"
          # GHC 9.4 (oldest)
          - os:
              name: Linux
              type: ubuntu-latest
            haskell:
              ghc:
                version: "9.4.8"
              cabal:
                version: "3.14.2.0"
                project-file: "cabal.project"
                extra-args: ""
                extra-args-test-golden: ""

    name: vehicle / ${{ matrix.os.name }} - GHC ${{ matrix.haskell.ghc.version }} ${{ matrix.haskell.cabal.extra-args }}
    runs-on: ${{ matrix.os.type }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # GHC 9.4.8 is configured to link with the gold linker (`ld.gold`),
      # which is no longer bundled with `binutils` from Ubuntu 26.04 onwards.
      - name: 🛠️ Install gold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-gold

      - name: 🛠️ Install Haskell
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.haskell.ghc.version }}
          cabal-version: ${{ matrix.haskell.cabal.version }}

      - name: 🛠️ Configure
        run: |
          cabal update
          cabal configure --project-file=${{ matrix.haskell.cabal.project-file }}
          cabal build all --project-file=${{ matrix.haskell.cabal.project-file }} --dry-run

      - name: 💾 Restore Cabal dependencies
        uses: actions/cache/restore@v6
        if: ${{ !env.ACT }}
        id: cache-haskell
        env:
          key: ${{ matrix.os.name }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: 🛠️ Install Cabal dependencies
        if: ${{ env.ACT || steps.cache-haskell.outputs.cache-hit != 'true' }}
        run: cabal build all --only-dependencies

      - name: 💾 Save Cabal dependencies
        uses: actions/cache/save@v6
        if: ${{ !env.ACT && steps.cache-haskell.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.cache-haskell.outputs.cache-primary-key }}

      - name: 🧪 Test Vehicle
        run: |
          cabal test                                                \
            vehicle:test:unit-tests                                 \
            --test-show-details=always                              \
            --test-option=--color=always                            \
            --project-file=${{ matrix.haskell.cabal.project-file }} \
            ${{ matrix.haskell.cabal.extra-args }}

          # LSP tests are disabled until the language server is more stable.
          #
          # cabal test                                                \
          #   vehicle:test:lsp-tests                                  \
          #   --test-show-details=always                              \
          #   --test-option=--color=always                            \
          #   --project-file=${{ matrix.haskell.cabal.project-file }} \
          #   ${{ matrix.haskell.cabal.extra-args }}

          cabal test                                                \
            vehicle:test:golden-tests                               \
            --test-show-details=always                              \
            --test-option=--color=always                            \
            --project-file=${{ matrix.haskell.cabal.project-file }} \
            ${{ matrix.haskell.cabal.extra-args }}                  \
            ${{ matrix.haskell.cabal.extra-args-test-golden }}
        shell: sh

      - name: 🏗️ Build the Vehicle .exe
        run: |
          cabal build                                                \
            vehicle:exe:vehicle                                      \
            --project-file=${{ matrix.haskell.cabal.project-file }}  \
            ${{ matrix.haskell.cabal.extra-args }}
