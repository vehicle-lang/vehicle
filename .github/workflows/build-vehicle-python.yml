name: Build vehicle-python

# NOTE: This workflow assumes a recent version of Python and pipx are available
#       on the runner.

on:
  workflow_call:
    inputs:
      deps-only:
        description: "Only build and cache dependencies; skip building and testing Vehicle."
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: sh

env:
  # NOTE: cibuildwheel builds Linux wheels in a container, where GHC and Cabal
  #       are installed by `vehicle-python/scripts/before-all-linux.sh`. These
  #       versions are passed through to that script, whose fallback defaults
  #       should be kept in sync with them.
  DEFAULT_GHC_VERSION: "9.12.2"
  DEFAULT_CABAL_VERSION: "3.14.2.0"

jobs:
  build-vehicle-python:
    strategy:
      matrix:
        os:
          - name: "Linux"
            type: "ubuntu-latest"
            arch: "x86_64"
            plat: "manylinux"
            test: "test,tensorflow"
          - name: "Linux"
            type: "ubuntu-latest"
            arch: "x86_64"
            plat: "musllinux"
            test: "test"
          - name: "macOS"
            type: "macos-15-intel"
            arch: "x86_64"
            plat: "macosx"
            test: "test,tensorflow"
          - name: "macOS"
            # macos-15 rather than macos-latest until actions/runner-images#14940 is fixed; see https://github.com/haskell/cabal/pull/12468.
            type: "macOS-15"
            arch: "arm64"
            plat: "macosx"
            test: "test,tensorflow"
          - name: "Windows"
            type: "windows-latest"
            arch: "AMD64"
            plat: "win"
            test: "test,tensorflow"

    name: vehicle-python / ${{ matrix.os.name }} - ${{ matrix.os.arch }}
    runs-on: ${{ matrix.os.type }}

    steps:
      - name: Enable symlinks
        if: matrix.os.name == 'Windows'
        run: git config --global core.symlinks true

      - name: Get source
        uses: actions/checkout@v7

      - name: 🛠️ Install Haskell
        # On Linux, Haskell is installed inside the cibuildwheel container instead
        if: matrix.os.name == 'macOS' || matrix.os.name == 'Windows'
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ env.DEFAULT_GHC_VERSION }}
          cabal-version: ${{ env.DEFAULT_CABAL_VERSION }}

      - name: 🛠️ Configure
        if: matrix.os.name == 'macOS' || matrix.os.name == 'Windows'
        working-directory: vehicle-python
        run: |
          cabal update
          cabal configure
          cabal build all --dry-run

      - name: 💾 Restore Cabal dependencies
        uses: actions/cache/restore@v6
        if: matrix.os.name == 'macOS' || matrix.os.name == 'Windows'
        id: cache-haskell
        env:
          key: ${{ matrix.os.name }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('vehicle-python/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Build wheel
        if: ${{ !inputs.deps-only }}
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: "./vehicle-python"
          output-dir: "./vehicle-python/wheelhouse"
          config-file: "{package}/pyproject.toml"
        env:
          CIBW_BUILD: "*${{ matrix.os.plat }}*"
          CIBW_ARCHS: "${{ matrix.os.arch }}"
          CIBW_TEST_EXTRAS: "${{ matrix.os.test }}"
          CIBW_TEST_COMMAND: "python -m pytest {package}/tests -v -o faulthandler_timeout=300"
          GHC_VERSION: "${{ env.DEFAULT_GHC_VERSION }}"
          CABAL_VERSION: "${{ env.DEFAULT_CABAL_VERSION }}"
          MACOSX_DEPLOYMENT_TARGET: "${{ matrix.os.arch == 'x86_64' && '10.10' || '11.0' }}"

      - name: 🛠️ Install Cabal dependencies
        if: inputs.deps-only && (matrix.os.name == 'macOS' || matrix.os.name == 'Windows') && steps.cache-haskell.outputs.cache-hit != 'true'
        working-directory: vehicle-python
        run: cabal build all --only-dependencies

      - name: 💾 Save Cabal dependencies
        uses: actions/cache/save@v6
        if: (matrix.os.name == 'macOS' || matrix.os.name == 'Windows') && steps.cache-haskell.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.cache-haskell.outputs.cache-primary-key }}

      - name: Upload wheels
        if: ${{ !inputs.deps-only }}
        uses: actions/upload-artifact@v7
        with:
          name: "wheelhouse-${{ matrix.os.plat }}-${{ matrix.os.arch }}"
          path: ./vehicle-python/wheelhouse/*.whl
