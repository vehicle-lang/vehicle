name: Test Rocq

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

defaults:
  run:
    shell: sh

jobs:
  test-vehicle-rocq:
    strategy:
      matrix:
        os:
          - name: "Linux"
            type: "ubuntu-latest"
          - name: "macOS"
            type: "macos-latest"
        haskell:
          - ghc:
              version: "9.6.5"
            cabal:
              version: "3.14.2.0"
              project-file: "cabal.project"
              extra-args: ""
              extra-args-test-golden: ""
        ocaml:
          - version: "5.4.1"
        rocq:
          - version: "9.1.1"

    name: Rocq / ${{ matrix.os.name }} - Rocq ${{ matrix.rocq.version }}
    runs-on: ${{ matrix.os.type }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install Haskell
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.haskell.ghc.version }}
          cabal-version: ${{ matrix.haskell.cabal.version }}

      - name: 🛠️ Configure
        run: |
          cabal configure --project-file=${{ matrix.haskell.cabal.project-file }}
          cabal build all --project-file=${{ matrix.haskell.cabal.project-file }} --dry-run

      - name: 💾 Restore Cabal dependencies
        uses: actions/cache/restore@v5
        if: ${{ !env.ACT }}
        id: cache-haskell
        env:
          key: ${{ matrix.os.name }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: 🛠️ Install Cabal dependencies
        if: ${{ env.ACT || steps.cache-haskell.outputs.cache-hit != 'true' }}
        run: cabal build all --only-dependencies

      - name: 💾 Save Cabal dependencies
        uses: actions/cache/save@v5
        if: ${{ !env.ACT && steps.cache-haskell.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.cache-haskell.outputs.cache-primary-key }}

      - name: 🛠️ Install OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: ${{ matrix.ocaml.version }}

      - name: 🛠️ Add Rocq opam repository
        run: opam repo add rocq-released https://rocq-prover.org/opam/released

      - name: 🛠️ Install Rocq
        run: opam install -y rocq-prover.${{ matrix.rocq.version }}

      # TODO: The vehicle-rocq companion library currently depends on the tensor
      # module that lives on the open math-comp PR #1535. Until that lands in
      # a tagged math-comp release (>= 2.6.0), pin math-comp to the tensor
      # branch so the dependency constraints in vehicle-rocq.opam resolve.
      - name: 🛠️ Pin math-comp tensor branch
        run: opam pin add -y -k git https://github.com/hoheinzollern/math-comp.git#tensor

      - name: 🛠️ Install vehicle-rocq
        run: opam install -y ./vehicle-rocq

      - name: 🧪 Test Vehicle-Rocq interaction
        run: |
          eval $(opam env)
          cabal test                                 \
            vehicle:test:golden-tests                \
            --test-show-details=always               \
            --test-option=--color=always             \
            --test-option=--num-threads=1            \
            --test-option=-p                         \
            --test-option='/Rocq/'                   \
            --test-option=--allowlist-externals=rocq

      # After the golden tests confirm the generator output matches each
      # committed Rocq.v.golden, compile each one through rocq to verify
      # the generated code actually typechecks against vehicle-rocq +
      # math-comp (textual diff alone wouldn't catch e.g. mathcomp notation
      # drift that breaks the generated proof).
      - name: 🧪 Typecheck generated Rocq outputs
        run: |
          eval $(opam env)
          set -e
          for f in vehicle/tests/golden/specifications/*/Rocq.v.golden; do
            tmp_dir="$(mktemp -d)"
            tmp_file="$tmp_dir/Generated.v"
            cp "$f" "$tmp_file"
            echo "==> rocq c $f"
            rocq c -native-compiler no "$tmp_file"
          done
