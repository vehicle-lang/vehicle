name: Test Rocq

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vehicle-rocq/**'
      - 'vehicle/src/Vehicle/Backend/ITP/Rocq*'
      - '.github/workflows/test-integration-rocq.yml'

defaults:
  run:
    shell: sh

jobs:
  test-vehicle-rocq:
    strategy:
      matrix:
        os:
          - name: "Linux"
            type: "ubuntu-latest"
            plat: "manylinux_2_17_x86_64.manylinux2014_x86_64"
          - name: "macOS"
            type: "macos-latest"
            plat: "macosx_10_9_x86_64"
        haskell:
          - ghc:
              version: "9.4.8"
            cabal:
              version: "3.14.2.1"
              project-file: "cabal.project.ghc-9.4.8"
              extra-args: ""
        ocaml:
          - version: "5"
        rocq:
          - version: "9.1.1"

    name: rocq / ${{ matrix.os.name }} - Ocaml ${{ matrix.ocaml.version }} - Rocq ${{ matrix.rocq.version }}
    runs-on: ${{ matrix.os.type }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Haskell
        uses: ./.github/actions/setup-haskell
        with:
          ghc-version: ${{ matrix.haskell.ghc.version }}
          cabal-version: ${{ matrix.haskell.cabal.version }}
          cabal-project-file: ${{ matrix.haskell.cabal.project-file }}
          cabal-project-freeze-file: ${{ matrix.haskell.cabal.project-file }}.freeze

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: ${{ matrix.ocaml.version }}

      - name: Add Rocq opam repository
        run: opam repo add rocq-released https://rocq-prover.org/opam/released

      - name: Install Rocq
        run: opam install -y rocq-prover.${{ matrix.rocq.version }}

      # TODO: The vehicle-rocq companion library currently depends on the tensor
      # module that lives on the open math-comp PR #1535. Until that lands in
      # a tagged math-comp release (>= 2.6.0), pin math-comp to the tensor
      # branch so the dependency constraints in vehicle-rocq.opam resolve.
      - name: Pin math-comp tensor branch
        run: opam pin add -y -k git https://github.com/hoheinzollern/math-comp.git#tensor

      - name: Install vehicle-rocq
        run: opam install -y ./vehicle-rocq

      - name: Run Vehicle golden tests for Rocq backend
        run: |
          eval $(opam env)
          cabal test                                 \
            vehicle:test:golden-tests                \
            --test-show-details=always               \
            --test-option=--color=always             \
            --test-option=--num-threads=1            \
            --test-option=--allowlist-externals=rocq

      - name: Typecheck generated Rocq outputs
        run: |
          eval $(opam env)
          set -e
          for f in vehicle/tests/golden/specifications/*/Rocq.v.golden; do
            tmp_dir="$(mktemp -d)"
            tmp_file="$tmp_dir/Generated.v"
            cp "$f" "$tmp_file"
            echo "==> rocq c $f"
            rocq c -native-compiler no "$tmp_file"
          done
