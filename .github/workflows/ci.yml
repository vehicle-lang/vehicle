name: CI

on:
  # Commits on `dev` are not tested on push, as they have already been tested
  # in the merge queue (see `merge_group` below). The dependency caches on
  # `dev` are instead refreshed by `warm-caches.yml`.
  push:
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

# Ensures that the previous workflow gets cancelled if a new
# commit is pushed to the PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  ################################################################################
  # Build and test
  #
  # On pull requests, only build and test on Linux with the primary GHC version.
  # The full matrix and the integration tests run in the merge queue.
  ################################################################################

  build-vehicle:
    uses: ./.github/workflows/build-vehicle.yml
    with:
      quick: ${{ github.event_name == 'pull_request' }}

  build-vehicle-python:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-vehicle-python.yml

  test-integration-isabelle:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-integration-isabelle.yml

  test-integration-rocq:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-integration-rocq.yml

  test-integration-agda:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-integration-agda.yml

  test-integration-bumpver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run bumpver update --patch --dry

  test-integration-citation-cff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dieghernan/cff-validator@v5

  test-integration-ormolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mrkkrp/ormolu-action@v15
        with:
          version: "0.7.1.0"

  ################################################################################
  # Summary check
  #
  # This is the only check that branch protection should require. It passes
  # when every job above has either passed or been deliberately skipped, so it
  # works for both pull requests and the merge queue.
  ################################################################################

  all-green:
    name: All checks passed
    if: always()
    needs:
      - build-vehicle
      - build-vehicle-python
      - test-integration-isabelle
      - test-integration-rocq
      - test-integration-agda
      - test-integration-bumpver
      - test-integration-citation-cff
      - test-integration-ormolu
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Check that every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # These jobs only run in the merge queue and on release tags, so they
          # are expected to be skipped on pull requests (and nowhere else).
          allowed-skips: >-
            ${{
              github.event_name == 'pull_request'
              && 'build-vehicle-python, test-integration-isabelle, test-integration-rocq, test-integration-agda'
              || '[]'
            }}

  ################################################################################
  # Publish package to GitHub Releases
  ################################################################################

  publish-package-to-github-releases:
    name: Publish package to GitHub Releases
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-vehicle
      - build-vehicle-python
      - test-integration-bumpver
      - test-integration-ormolu

    permissions:
      contents: write

    steps:
      - name: Download wheelhouse
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-*-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: wheelhouse/*.whl
          fail_on_unmatched_files: true

  ################################################################################
  # Publish package to PyPI
  ################################################################################

  publish-package-to-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-vehicle
      - build-vehicle-python
      - test-integration-isabelle
      - test-integration-rocq
      - test-integration-bumpver
      - test-integration-citation-cff
      - test-integration-ormolu

    environment:
      name: pypi
      url: https://pypi.org/p/vehicle-lang

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download wheelhouse
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-*-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
