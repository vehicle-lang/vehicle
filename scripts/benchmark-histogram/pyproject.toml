 [build-system]
 requires = ["hatchling>=1.21"]
 build-backend = "hatchling.build"

 [project]
 name = "benchmark-histogram"
 version = "0.1.0"
 description = "Generate histograms from Vehicle benchmark results"
 readme = "README.md"
 authors = [{ name = "Wen Kokke", email = "wenkokke@users.noreply.github.com" }]
 license = { text = "MIT" }
 requires-python = ">=3.10"
 dependencies = [
	 "click>=8.1.7,<9",
	 "dataclasses-json>=0.6,<1",
	 "matplotlib>=3.9,<4",
	 "pandas>=2.2,<3",
	 "seaborn>=0.13,<0.14",
 ]

 [project.scripts]
 benchmark-histogram = "benchmark_histogram.main:main"

 [tool.uv]
 default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["benchmark_histogram"]

[tool.hatch.build.targets.sdist]
include = [
	"benchmark_histogram",
	"README.md",
]
